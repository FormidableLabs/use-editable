name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript Check
        run: npm run check
      - name: Build
        run: npm run build

  react-compat:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lockfile pins React 19, so `check` above already covers it. This
        # job covers the other end of the `>=18.0.0` peer range. React is
        # pinned exactly so a newer 18.x can't silently satisfy a claim about
        # 18.0.0; the types float on `^18` since they aren't the peer dep.
        include:
          - react: '18.0.0'
            types: '^18'
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Pin React ${{ matrix.react }}
        run: |
          npm pkg set \
            devDependencies.react="${{ matrix.react }}" \
            "devDependencies.@types/react=${{ matrix.types }}"
          npm install --no-package-lock
      - name: TypeScript Check
        run: npm run check
